version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      test:
        patterns: ["org.junit*", "org.robolectric*", "io.github.takahirom.roborazzi*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
