name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (format, lint, tests, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Iowa tuba recordings for the regression test (docs/testdata.md): downloaded once, verified by checksum.
      - name: Cache test recordings
        uses: actions/cache@v6
        with:
          path: testdata/cache
          key: testdata-${{ hashFiles('tools/replay/src/test/resources/iowa/*.sha256') }}

      - name: Check and build debug APK
        run: ./gradlew check assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stimmzug-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
