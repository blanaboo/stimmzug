name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STIMMZUG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Check and build signed release APK
        env:
          STIMMZUG_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STIMMZUG_KEYSTORE_PASSWORD: ${{ secrets.STIMMZUG_KEYSTORE_PASSWORD }}
          STIMMZUG_KEY_ALIAS: ${{ secrets.STIMMZUG_KEY_ALIAS }}
          STIMMZUG_KEY_PASSWORD: ${{ secrets.STIMMZUG_KEY_PASSWORD }}
        run: >-
          ./gradlew check assembleRelease
          -Pstimmzug.versionName=${{ steps.version.outputs.name }}
          -Pstimmzug.versionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/stimmzug-${{ steps.version.outputs.name }}.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Stimmzug ${{ steps.version.outputs.name }}"
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
