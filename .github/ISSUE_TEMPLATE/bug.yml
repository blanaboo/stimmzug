name: "Fehler melden"
description: Etwas funktioniert nicht wie erwartet.
labels: ["bug"]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Kurze Beschreibung des Fehlers.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. App öffnen
        2. ...
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App-Version
      placeholder: z. B. 0.1.0
  - type: input
    id: geraet
    attributes:
      label: Gerät / Android-Version
  - type: dropdown
    id: ausgabe
    attributes:
      label: Audio-Ausgabe
      options:
        - Handy-Lautsprecher
        - Kabel-Kopfhörer
        - Bluetooth-Kopfhörer
        - Bluetooth-Lautsprecher
        - Sonstiges / nicht relevant
  - type: textarea
    id: belege
    attributes:
      label: Logs / Screenshots
      render: text
